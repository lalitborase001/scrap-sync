AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Informal Recycler Bidding Hub - e-waste image analysis (Bedrock) and recycler SMS alerts (SNS)

Parameters:
  AlertPhoneNumber:
    Type: String
    # TODO: replace with your test phone number in E.164 format (e.g. +919876543210).
    # New AWS accounts are in the SNS SMS sandbox: the number must be verified
    # in the SNS console (Text messaging (SMS) -> Sandbox destination phone numbers).
    Default: "+910000000000"
    Description: Hardcoded test recycler phone number (E.164)
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model used for vision/pricing analysis
  FrontendOrigin:
    Type: String
    # Value must include the single quotes. TODO: change to your Amplify domain after first deploy.
    Default: "'http://localhost:5173'"
    Description: Allowed CORS origin for the API

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256

Resources:
  # ---------------------------------------------------------------- Storage
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # NOTE: the name is built from account/region (not a !Ref) so the function's IAM
      # policy can reference it without creating a circular dependency with the S3 trigger.
      # Bucket names must be lowercase, so keep your stack name lowercase.
      BucketName: !Sub "${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  EWasteLotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EWasteLots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LotId
          AttributeType: S
      KeySchema:
        - AttributeName: LotId
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  EwasteBidsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EwasteBids
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LotId
          AttributeType: S
      KeySchema:
        - AttributeName: LotId
          KeyType: HASH

  # ------------------------------------------------------------------- Auth
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false # browser apps cannot keep a secret
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # -------------------------------------------------------------------- API
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'POST,GET,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Ref FrontendOrigin
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # -------------------------------------------------------------- Functions
  AnalyzeImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analyze_image/
      Handler: app.lambda_handler
      Timeout: 60 # vision call can take a while
      Environment:
        Variables:
          TABLE_NAME: !Ref EwasteBidsTable
          BUCKET_NAME: !Sub "${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}"
          MODEL_ID: !Ref BedrockModelId
      Policies:
        # Bedrock: invoke only this one foundation model.
        # TODO: model access for Claude 3 Haiku must be enabled in the Bedrock console
        # for this region, and the region must offer the model (us-east-1 is safe).
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
        # S3: read uploads, write API-submitted images, nothing else.
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}/*"
        # DynamoDB: put new lots into EwasteBids and EWasteLots tables.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt EwasteBidsTable.Arn
                - !GetAtt EWasteLotsTable.Arn
      Events:
        # Path 1: image dropped straight into s3://<bucket>/uploads/
        # (the API path below writes to api/, so the two never trigger each other)
        S3Upload:
          Type: S3
          Properties:
            Bucket: !Ref UploadsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
        # Path 2: POST from the React app
        ApiPost:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /analyze
            Method: post
            Auth:
              Authorizer: NONE

  SendAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: send_alert/
      Handler: app.lambda_handler
      Environment:
        Variables:
          ALERT_PHONE_NUMBER: !Ref AlertPhoneNumber
      Policies:
        # SNS: direct-to-phone SMS cannot be scoped to a resource ARN, so "*" is the
        # tightest option here. If you later switch to a topic, scope to its ARN.
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: "*"
        # DynamoDB Streams: read this table's stream only.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
              Resource: !GetAtt EWasteLotsTable.StreamArn
      Events:
        LotInserted:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt EWasteLotsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'

  ClaimScrapFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: claim_scrap/
      Handler: app.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref EwasteBidsTable
          ALERT_PHONE_NUMBER: !Ref AlertPhoneNumber
      Policies:
        # SNS: publish SMS to verified phone numbers
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: "*"
        # DynamoDB: read scrap item details from EwasteBids and EWasteLots tables
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt EwasteBidsTable.Arn
                - !GetAtt EWasteLotsTable.Arn
      Events:
        ClaimPost:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /claim
            Method: post
            Auth:
              Authorizer: NONE
        LotsGet:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /lots
            Method: get
            Auth:
              Authorizer: NONE

Outputs:
  AnalyzeApiUrl:
    Description: POST endpoint for the React app (VITE_API_URL)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/Prod/analyze"
  ClaimApiUrl:
    Description: POST endpoint for claiming scrap and sending SMS alert
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/Prod/claim"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  UploadsBucketName:
    Value: !Ref UploadsBucket