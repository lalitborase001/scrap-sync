AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Informal Recycler Bidding Hub - e-waste image analysis (Bedrock) and
  recycler SMS alerts (SNS)
Parameters:
  AlertPhoneNumber:
    Type: String
    Default: '+910000000000'
    Description: Hardcoded test recycler phone number (E.164)
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Bedrock model used for vision/pricing analysis
  FrontendOrigin:
    Type: String
    Default: '''http://localhost:5173'''
    Description: Allowed CORS origin for the API
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
  EWasteLotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EWasteLots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: LotId
        AttributeType: S
      KeySchema:
      - AttributeName: LotId
        KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_IMAGE
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: ${AWS::StackName}-users
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId:
        Ref: UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: '''POST,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin:
          Ref: FrontendOrigin
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Fn::GetAtt:
              - UserPool
              - Arn
  AnalyzeImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AnalyzeImageFunction
      Handler: app.lambda_handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME:
            Ref: EWasteLotsTable
          BUCKET_NAME:
            Fn::Sub: ${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}
          MODEL_ID:
            Ref: BedrockModelId
      Policies:
      - Statement:
        - Effect: Allow
          Action: bedrock:InvokeModel
          Resource:
            Fn::Sub: arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
      - Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:PutObject
          Resource:
            Fn::Sub: arn:aws:s3:::${AWS::StackName}-uploads-${AWS::AccountId}-${AWS::Region}/*
      - Statement:
        - Effect: Allow
          Action: dynamodb:PutItem
          Resource:
            Fn::GetAtt:
            - EWasteLotsTable
            - Arn
      Events:
        S3Upload:
          Type: S3
          Properties:
            Bucket:
              Ref: UploadsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                - Name: prefix
                  Value: uploads/
        ApiPost:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /analyze
            Method: post
    Metadata:
      SamResourceId: AnalyzeImageFunction
  SendAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: SendAlertFunction
      Handler: app.lambda_handler
      Environment:
        Variables:
          ALERT_PHONE_NUMBER:
            Ref: AlertPhoneNumber
      Policies:
      - Statement:
        - Effect: Allow
          Action: sns:Publish
          Resource: '*'
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:DescribeStream
          - dynamodb:GetRecords
          - dynamodb:GetShardIterator
          Resource:
            Fn::GetAtt:
            - EWasteLotsTable
            - StreamArn
      Events:
        LotInserted:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
              - EWasteLotsTable
              - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            FilterCriteria:
              Filters:
              - Pattern: '{"eventName": ["INSERT"]}'
    Metadata:
      SamResourceId: SendAlertFunction
Outputs:
  AnalyzeApiUrl:
    Description: POST endpoint for the React app (VITE_API_URL)
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.amazonaws.com/Prod/analyze
  UserPoolId:
    Value:
      Ref: UserPool
  UserPoolClientId:
    Value:
      Ref: UserPoolClient
  UploadsBucketName:
    Value:
      Ref: UploadsBucket
